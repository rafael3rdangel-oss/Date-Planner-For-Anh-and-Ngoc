<!DOCTYPE html>
<html>
<head>
  <title>Date Planner for Us 💖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
   * {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: "Arial", sans-serif;
  background: linear-gradient(135deg, #fff7fb, #ffe4f1, #e8f3ff);
  color: #555;
}

/* Header */
header {
  text-align: center;
  padding: 22px;
  font-size: 28px;
  font-weight: bold;
  color: #ff69b4;
}

/* Tabs */
.tabs {
  display: flex;
  justify-content: space-around;
  padding: 12px;
  background: white;
  position: sticky;
  top: 0;
  box-shadow: 0 4px 12px rgba(0,0,0,.06);
  border-bottom-left-radius: 20px;
  border-bottom-right-radius: 20px;
}

.tab {
  border: none;
  background: #ffd6e8;
  padding: 10px 14px;
  border-radius: 999px;
  cursor: pointer;
  font-size: 14px;
  transition: 0.2s;
}

.tab:hover {
  transform: scale(1.05);
  background: #ffc2dd;
}

/* Layout */
.section {
  padding: 15px;
}

/* Cards */
.card {
  background: white;
  border-radius: 24px;
  padding: 16px;
  margin-bottom: 16px;
  box-shadow: 0 8px 20px rgba(0,0,0,.08);
  border: 1px solid #ffe4f1;
}

/* Titles */
.title {
  font-weight: bold;
  margin-bottom: 10px;
  color: #ff69b4;
}

/* Inputs */
input {
  width: 100%;
  padding: 12px;
  border-radius: 14px;
  border: 1px solid #eee;
  margin-bottom: 10px;
  outline: none;
}

input:focus {
  border-color: #ffb6d5;
}

/* Buttons */
button.add {
  width: 100%;
  border: none;
  background: linear-gradient(135deg, #ffd6e8, #ffe4f1);
  padding: 12px;
  border-radius: 14px;
  cursor: pointer;
  font-weight: bold;
}

/* Items */
.item {
  background: #fff7fb;
  border-radius: 14px;
  padding: 10px;
  margin-top: 8px;
  border-left: 4px solid #ffb6d5;
}
  </style>
</head>

<body>

<header>
  🌸 Date Planner for Us
</header>

<div class="tabs">

  <button class="tab" onclick="showTab('planner')">🏠 Planner</button>
  <button class="tab" onclick="showTab('food')">🍜 Food</button>
  <button class="tab" onclick="showTab('games')">🎮 Games</button>
  <button class="tab" onclick="showTab('notes')">📝 Notes</button>

</div>

<div class="section">

  <!-- PLANNER TAB -->
  <div id="planner" class="tabPage">

    <div class="card">
      <div class="title">🌅 Morning</div>

      <input id="text" placeholder="Add activity..." />

      <button class="add" onclick="add()">
        Add Activity
      </button>

      <div id="list"></div>
    </div>

  </div>

  <!-- FOOD TAB -->
  <div id="food" class="tabPage" style="display:none;">
    <div class="card">🍜 Food list coming soon</div>
  </div>

  <!-- GAMES TAB -->
  <div id="games" class="tabPage" style="display:none;">
    <div class="card">🎮 Games list coming soon</div>
  </div>

  <!-- NOTES TAB -->
  <div id="notes" class="tabPage" style="display:none;">
    <div class="card">📝 Notes coming soon</div>
  </div>

</div>

<script>
async function load() {
  const res = await fetch("/api/planner");
  const data = await res.json();

  document.getElementById("list").innerHTML =
    data.map(i => `
      <div class="item">
        🌸 ${i.text}
      </div>
    `).join("");
}

async function add() {
  const text = document.getElementById("text").value;

  if (!text) return;

  await fetch("/api/planner", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ text })
  });

  document.getElementById("text").value = "";

  load();
}

load();

  function showTab(tab) {
  document.querySelectorAll(".tabPage").forEach(t => {
    t.style.display = "none";
  });

  document.getElementById(tab).style.display = "block";
}
</script>

</body>
</html>
